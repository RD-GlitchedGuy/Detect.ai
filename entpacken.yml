# Entpackt jede hochgeladene .zip im Hauptordner des Repos automatisch
# und löscht die Zip danach. Ablegen unter: .github/workflows/entpacken.yml
name: Zip entpacken

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip entpacken
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Entpacke $z"
            unzip -o "$z" -d .
            git rm -q "$z"
          done

      - name: Änderungen hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update aus Zip entpackt" || echo "Nichts zu tun"
          git push
